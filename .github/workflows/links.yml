name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ojs.aaai.org serves fine in a browser but breaks lychee with an HTTP/2
      # protocol error from the runner, so the Anchors paper link is skipped.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept "200..204,206,403,429" --exclude "ojs\.aaai\.org" README.md
          fail: true
      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling on every run keeps the schedule alive.
      - name: Keep the scheduled workflow enabled
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/links.yml/enable
